# Two-way mirror sync (token-free): keeps main identical between
#   sravanku018/<repo>  <->  SmartSurveyX/<repo>
#
# Each side only ever updates ITSELF: it pulls the mirror's main (both repos
# are public, so no credentials are needed) and fast-forwards its own main
# when the mirror is ahead, using the built-in GITHUB_TOKEN.
# A push on either side triggers that side's run; the other side converges
# on its next scheduled run (every 10 minutes).
# Divergence is flagged, never auto-merged.
name: Mirror sync

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-sync-${{ github.repository }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull mirror main and fast-forward self if behind
        shell: bash
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          if [ "$OWNER" = "sravanku018" ]; then OTHER="SmartSurveyX/$REPO"; else OTHER="sravanku018/$REPO"; fi

          git config user.name "mirror-sync-bot"
          git config user.email "mirror-sync-bot@users.noreply.github.com"
          git remote add other "https://github.com/${OTHER}.git"
          git fetch other main

          SELF=$(git rev-parse HEAD)
          OTHER_SHA=$(git rev-parse FETCH_HEAD)
          echo "self=$SELF  mirror=$OTHER_SHA ($OTHER)"

          if [ "$SELF" = "$OTHER_SHA" ]; then
            echo "Already in sync."
            exit 0
          fi
          if git merge-base --is-ancestor "$SELF" "$OTHER_SHA"; then
            echo "Mirror ahead -> fast-forwarding self (token-free)"
            git push origin "$OTHER_SHA:refs/heads/main"
          elif git merge-base --is-ancestor "$OTHER_SHA" "$SELF"; then
            echo "Self ahead -> mirror will pull this on its next run."
          else
            echo "::error::$REPO diverged between sravanku018 and SmartSurveyX — manual merge required"
            exit 1
          fi
